name: 'Configure Wine'
description: 'Crossover-version independent action to configure Wine'
inputs:
  winearch:
    description: 'wine64 or wine32on64'
    required: true
    default: "wine64"
  crossflags:
    descriptions: 'CROSSFLAGS to be given to ming-w64'
    required: true
    default: "-g -O2"
  cflags:
    descriptions: 'CFLAGS to be given to clang'
    required: true
    # Xcode12 by default enables '-Werror,-Wimplicit-function-declaration' (49917738)
    # this causes wine(64) builds to fail so needs to be disabled.
    # https://developer.apple.com/documentation/xcode-release-notes/xcode-12-release-notes    
    default: "-g -O2 -Wno-implicit-function-declaration -Wno-deprecated-declarations -Wno-format"
  ldflags:
    descriptions: 'LDFLAGS to be given to clang'
    required: true
    default: "-Wl,-headerpad_max_install_names"
  build-dir:
    description: 'Build directory'
    required: true
  wine-configure:
    description: 'Path to wine configure script'
    required: true
    default: ${{ github.workspace }}/sources/wine/configure
  configure-params:
    description: 'additional parameters to be given to the wine configure script'
    required: true
    default: "--enable-win64 --with-vulkan"
runs:
  using: "composite"
  steps:
      - name: Configure ${{ inputs.winearch }}
        id: configure
        env:
          CC: /opt/local/libexec/llvm-cx/bin/clang -arch x86_64
          CXX: /opt/local/libexec/llvm-cx/bin/clang++ -arch x86_64
          CROSSCFLAGS: ${{ inputs.crossflags }}
          CFLAGS: ${{ inputs.cflags }}
          LDFLAGS: ${{ inputs.ldflags }}
        run: |
          set -x
          export CFLAGS="${CFLAGS} -arch x86_64 -I/opt/local/include"
          export LDFLAGS="${LDFLAGS} -arch x86_64 -L/opt/local/lib -Wl,-rpath,/opt/local/lib"

          export GPHOTO2_CFLAGS="-I/opt/local/include -I/opt/local/include/gphoto2"
          export GPHOTO2_PORT_CFLAGS="${GPHOTO2_CFLAGS}"
          export SDL2_CFLAGS="-I/opt/local/include -I/opt/local/include/SDL2"

          export ac_cv_lib_soname_vulkan=""
          export ac_cv_lib_soname_MoltenVK="${INSTALLROOT}/${MOLTENVK_DXVK_INSTALLATION}/usr/local/lib/libMoltenVK.dylib"

          mkdir -p ${{ inputs.build-dir }}/
          pushd ${{ inputs.build-dir }}
          arch -x86_64 ${{ inputs.wine-configure }} \
                    --build=x86_64-apple-darwin \
                    --disable-option-checking \
                    --disable-tests \
                    --without-alsa \
                    --without-capi \
                    --without-dbus \
                    --without-inotify \
                    --without-oss \
                    --without-pulse \
                    --without-udev \
                    --without-usb \
                    --without-v4l2 \
                    --without-gsm \
                    --without-quicktime \
                    --without-x \
                    ${{ inputs.configure-params }} || cat config.log
          popd

        shell: bash
