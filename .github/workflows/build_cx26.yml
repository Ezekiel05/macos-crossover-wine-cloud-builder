name: Wine-Crossover-26-MacOS

on:
  workflow_dispatch:

env:
    MACOSX_DEPLOYMENT_TARGET: 10.14
    WINE_CONFIGURE: ${{ github.workspace }}/sources/wine/configure
    BUILDROOT: ${{ github.workspace }}/build
    INSTALLROOT: ${{ github.workspace }}/install
    CROSS_OVER_VERSION: 26.3.0
    CROSS_OVER_SOURCE_URL: https://media.codeweavers.com/pub/crossover/source/crossover-sources-26.3.0.tar.gz
    CROSS_OVER_LOCAL_FILE: crossover-26.3.0
    WINE_INSTALLATION: wine-cx26.3.0
    MOLTENVK_DXVK_INSTALLATION: moltenvk-dxvk

jobs:
  moltenVK_DXVK:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify x86_64 build environment
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch -x86_64 /usr/bin/true
          fi

      - name: Restore MoltenVK / DXVK from cache
        uses: actions/cache@v4
        id: cache_moltenVK_DXVK
        with:
          path: ${{ env.INSTALLROOT }}/${{ env.MOLTENVK_DXVK_INSTALLATION }}
          key: cache_moltenVK_DXVK_cx26_x86_64_v1

      - name: Bootstrap MacPorts
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        run: bash .github/workflows/bootstrap_macports.sh

      - name: Install MoltenVK / DXVK build dependencies
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        run: arch -x86_64 sudo /opt/local/bin/port install glslang mingw-w64 meson

      - name: Add MacPorts to $PATH
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        run: |
          printf '%s\n' /opt/local/bin /opt/local/sbin >> "$GITHUB_PATH"

      - name: Get and Extract Source
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        uses: ./.github/actions/get_source
        with:
          crossover-local-file: "${{ env.CROSS_OVER_LOCAL_FILE }}"
          crossover-source-url: "${{ env.CROSS_OVER_SOURCE_URL }}"

      - name: Set up Python 3.11
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build / Install MoltenVK and DXVK
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        uses: ./.github/actions/build_moltenvk_dxvk
        with:
          install-prefix: "${{ env.INSTALLROOT }}/${{ env.MOLTENVK_DXVK_INSTALLATION }}"

      - name: Tar MoltenVK / DXVK
        run: |
          set -x
          pushd ${{ env.INSTALLROOT }}
          tar -czf ${{ env.MOLTENVK_DXVK_INSTALLATION }}.tar.gz ${{ env.MOLTENVK_DXVK_INSTALLATION }}
          popd

      - name: Upload MoltenVK / DXVK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOLTENVK_DXVK_INSTALLATION }}
          path: ${{ env.INSTALLROOT }}/${{ env.MOLTENVK_DXVK_INSTALLATION }}.tar.gz

  wine-crossover:
    needs: [moltenVK_DXVK]
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify x86_64 build environment
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch -x86_64 /usr/bin/true
          fi

      - name: Bootstrap MacPorts
        run: bash .github/workflows/bootstrap_macports.sh

      - name: Make MacPorts build with Xcode
        # MacPorts compiles with the Command Line Tools when they exist, but on GitHub's Apple Silicon
        # runners their libxcrun has no x86_64 slice, so every x86_64 build fails ("unable to load libxcrun").
        # Hiding them makes MacPorts use the full Xcode, which works under Rosetta.
        run: |
          set -euo pipefail
          if [ -d /Library/Developer/CommandLineTools ]; then
            sudo mv /Library/Developer/CommandLineTools /Library/Developer/CommandLineTools.disabled
          fi
          xcode-select -p
          arch -x86_64 /usr/bin/xcrun --show-sdk-path

      # Building llvm-cx takes over an hour, so keep the result between runs
      - name: Restore llvm-cx from cache
        id: llvmcx-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/llvm-cx-cache/llvm-cx.tar.gz
          key: llvm-cx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/install_llvm_cx.sh') }}

      - name: Unpack cached llvm-cx
        if: steps.llvmcx-cache.outputs.cache-hit == 'true'
        run: |
          sudo mkdir -p /opt/local/libexec
          sudo tar -xzf "$RUNNER_TEMP/llvm-cx-cache/llvm-cx.tar.gz" -C /opt/local/libexec
          /opt/local/libexec/llvm-cx/bin/clang --version

      - name: Install llvm-cx
        if: steps.llvmcx-cache.outputs.cache-hit != 'true'
        timeout-minutes: 300
        run: bash .github/workflows/install_llvm_cx.sh

      - name: Pack llvm-cx for the cache
        if: steps.llvmcx-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-cx-cache"
          tar -czf "$RUNNER_TEMP/llvm-cx-cache/llvm-cx.tar.gz" -C /opt/local/libexec llvm-cx

      - name: Save llvm-cx to cache
        if: steps.llvmcx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/llvm-cx-cache/llvm-cx.tar.gz
          key: ${{ steps.llvmcx-cache.outputs.cache-primary-key }}

      - name: Verify x86_64 llvm-cx compiler
        run: |
          set -euo pipefail
          printf 'int main(void) { return 0; }\n' |
            arch -x86_64 /opt/local/libexec/llvm-cx/bin/clang \
              -arch x86_64 -x c -c -o "$RUNNER_TEMP/llvm-cx-x86_64.o" -
          test "$(/usr/bin/lipo -archs "$RUNNER_TEMP/llvm-cx-x86_64.o")" = "x86_64"
          printf 'int main() { return 0; }\n' |
            arch -x86_64 /opt/local/libexec/llvm-cx/bin/clang++ \
              -arch x86_64 -x c++ -c -o "$RUNNER_TEMP/llvm-cx-cxx-x86_64.o" -
          test "$(/usr/bin/lipo -archs "$RUNNER_TEMP/llvm-cx-cxx-x86_64.o")" = "x86_64"

      - name: Install Wine Build Dependencies
        run: |
          arch -x86_64 sudo /opt/local/bin/port install \
            bison flex gettext mingw-w64 pkgconfig

      - name: Install Wine Runtime Dependencies
        run: |
          arch -x86_64 sudo /opt/local/bin/port install \
            freetype \
            gnutls-devel \
            gettext-runtime \
            libpcap \
            libsdl2 \
            gstreamer1-gst-plugins-base \
            kerberos5

      - name: Add build tools to $PATH
        run: |
          echo "/opt/local/bin" >> $GITHUB_PATH
          echo "/opt/local/sbin" >> $GITHUB_PATH
          echo "/opt/local/libexec/llvm-cx/bin" >> $GITHUB_PATH
          # llvm-cx's clang doesn't locate the macOS SDK by itself
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      - name: Download MoltenVK / DXVK
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOLTENVK_DXVK_INSTALLATION }}
          path: ${{ env.INSTALLROOT }}

      - name: Unpack MoltenVK / DXVK
        run: |
          set -x
          mkdir -p ${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}
          pushd ${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}
          tar --strip-components=1 -xvf ${{ env.INSTALLROOT }}/${{ env.MOLTENVK_DXVK_INSTALLATION }}.tar.gz
          popd

      - name: Get and Extract Source
        uses: ./.github/actions/get_source
        with:
          crossover-local-file: "${{ env.CROSS_OVER_LOCAL_FILE }}"
          crossover-source-url: "${{ env.CROSS_OVER_SOURCE_URL }}"

      # CrossOver 23+ dropped the old wine32on64 hack. Wine now builds 32- and 64-bit
      # Windows support in a single "WoW64" build, so there is one configure/make/install.
      - name: Diagnose llvm-cx test programs
        # Wine's configure says "cannot run C compiled programs"; this shows why.
        run: |
          set +e
          cd "$RUNNER_TEMP"
          printf '#include <stdio.h>\nint main(void){puts("hello from x86_64");return 0;}\n' > hello.c
          echo "SDKROOT=$SDKROOT  MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET:-unset}"
          try() {
            local label="$1"; shift
            echo "================ $label"
            echo "+ $*"
            "$@" hello.c -o "hello-$label" 2>&1 | tail -n 20
            echo "compile exit: ${PIPESTATUS[0]}"
            [ -f "hello-$label" ] || return
            file "hello-$label"
            otool -l "hello-$label" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | head -n 12
            otool -L "hello-$label"
            codesign -dv "hello-$label" 2>&1 | head -n 3
            arch -x86_64 "./hello-$label"; echo "run exit: $?"
          }
          try llvmcx        /opt/local/libexec/llvm-cx/bin/clang -arch x86_64 -g -O2 -Wl,-headerpad_max_install_names
          try llvmcx-11     /opt/local/libexec/llvm-cx/bin/clang -arch x86_64 -mmacosx-version-min=11.0
          try llvmcx-sign   sh -c '/opt/local/libexec/llvm-cx/bin/clang -arch x86_64 "$0" -o "$2" && codesign -s - -f "$2"' 
          try appleclang    /usr/bin/clang -arch x86_64
          echo "================ verbose link (llvm-cx)"
          /opt/local/libexec/llvm-cx/bin/clang -arch x86_64 -v hello.c -o hello-v 2>&1 | tail -n 15
          exit 0

      - name: Configure wine
        uses: ./.github/actions/configure_wine
        with:
          winearch: "wine (WoW64)"
          build-dir: "${{ env.BUILDROOT }}/wine"
          crossflags: "-g -O2"
          configure-params: "--enable-archs=i386,x86_64 --with-vulkan"

      - name: Build wine
        uses: ./.github/actions/make
        with:
          build-dir: "${{ env.BUILDROOT }}/wine"

      - name: Install wine
        uses: ./.github/actions/install
        with:
          build-dir: "${{ env.BUILDROOT }}/wine"
          install-dir: "${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}"

      - name: Add wine64 compatibility symlink
        run: |
          pushd ${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}/usr/local/bin
          ls -la
          # Newer Wine installs a single "wine" loader; keep "wine64" for tools that expect it.
          if [ -e wine ] && [ ! -e wine64 ]; then ln -s wine wine64; fi
          popd

      - name: Tar Wine
        run: |
          set -x
          pushd ${{ env.INSTALLROOT }}
          tar -czvf ${{ env.WINE_INSTALLATION }}.tar.gz ${{ env.WINE_INSTALLATION }}
          popd

      - name: Upload Wine
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINE_INSTALLATION }}
          path: ${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}.tar.gz
