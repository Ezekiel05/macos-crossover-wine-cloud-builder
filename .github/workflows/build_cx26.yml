name: Wine-Crossover-26-MacOS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the finished Wine as a GitHub Release (WineBridge downloads it from there)'
        type: boolean
        default: true

env:
    MACOSX_DEPLOYMENT_TARGET: 10.14
    WINE_CONFIGURE: ${{ github.workspace }}/sources/wine/configure
    BUILDROOT: ${{ github.workspace }}/build
    INSTALLROOT: ${{ github.workspace }}/install
    CROSS_OVER_VERSION: 26.3.0
    CROSS_OVER_SOURCE_URL: https://media.codeweavers.com/pub/crossover/source/crossover-sources-26.3.0.tar.gz
    CROSS_OVER_LOCAL_FILE: crossover-26.3.0
    WINE_INSTALLATION: wine-cx26.3.0
    MOLTENVK_DXVK_INSTALLATION: moltenvk-dxvk

jobs:
  moltenVK_DXVK:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify x86_64 build environment
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch -x86_64 /usr/bin/true
          fi

      - name: Restore MoltenVK / DXVK from cache
        uses: actions/cache@v4
        id: cache_moltenVK_DXVK
        with:
          path: ${{ env.INSTALLROOT }}/${{ env.MOLTENVK_DXVK_INSTALLATION }}
          key: cache_moltenVK_DXVK_cx26_x86_64_v1

      - name: Bootstrap MacPorts
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        run: bash .github/workflows/bootstrap_macports.sh

      - name: Install MoltenVK / DXVK build dependencies
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        run: arch -x86_64 sudo /opt/local/bin/port install glslang mingw-w64 meson

      - name: Add MacPorts to $PATH
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        run: |
          printf '%s\n' /opt/local/bin /opt/local/sbin >> "$GITHUB_PATH"

      - name: Get and Extract Source
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        uses: ./.github/actions/get_source
        with:
          crossover-local-file: "${{ env.CROSS_OVER_LOCAL_FILE }}"
          crossover-source-url: "${{ env.CROSS_OVER_SOURCE_URL }}"

      - name: Set up Python 3.11
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build / Install MoltenVK and DXVK
        if: steps.cache_moltenVK_DXVK.outputs.cache-hit != 'true'
        uses: ./.github/actions/build_moltenvk_dxvk
        with:
          install-prefix: "${{ env.INSTALLROOT }}/${{ env.MOLTENVK_DXVK_INSTALLATION }}"

      - name: Tar MoltenVK / DXVK
        run: |
          set -x
          pushd ${{ env.INSTALLROOT }}
          tar -czf ${{ env.MOLTENVK_DXVK_INSTALLATION }}.tar.gz ${{ env.MOLTENVK_DXVK_INSTALLATION }}
          popd

      - name: Upload MoltenVK / DXVK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOLTENVK_DXVK_INSTALLATION }}
          path: ${{ env.INSTALLROOT }}/${{ env.MOLTENVK_DXVK_INSTALLATION }}.tar.gz

  wine-crossover:
    needs: [moltenVK_DXVK]
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify x86_64 build environment
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch -x86_64 /usr/bin/true
          fi

      - name: Bootstrap MacPorts
        run: bash .github/workflows/bootstrap_macports.sh

      - name: Make MacPorts build with Xcode
        # MacPorts compiles with the Command Line Tools when they exist, but on GitHub's Apple Silicon
        # runners their libxcrun has no x86_64 slice, so every x86_64 build fails ("unable to load libxcrun").
        # Hiding them makes MacPorts use the full Xcode, which works under Rosetta.
        run: |
          set -euo pipefail
          if [ -d /Library/Developer/CommandLineTools ]; then
            sudo mv /Library/Developer/CommandLineTools /Library/Developer/CommandLineTools.disabled
          fi
          xcode-select -p
          arch -x86_64 /usr/bin/xcrun --show-sdk-path

      # CrossOver 26 builds Wine as WoW64 (32-bit code is PE, built by mingw-w64), so it no longer
      # needs CodeWeavers' llvm-cx (an LLVM 8 fork that crashes on the macOS 26 SDK). Xcode's clang is used.

      - name: Install Wine Build Dependencies
        run: |
          arch -x86_64 sudo /opt/local/bin/port install \
            bison flex gettext mingw-w64 pkgconfig

      - name: Install Wine Runtime Dependencies
        run: |
          arch -x86_64 sudo /opt/local/bin/port install \
            freetype \
            gnutls-devel \
            gettext-runtime \
            libpcap \
            libsdl2 \
            gstreamer1-gst-plugins-base \
            kerberos5

      - name: Add build tools to $PATH
        run: |
          echo "/opt/local/bin" >> $GITHUB_PATH
          echo "/opt/local/sbin" >> $GITHUB_PATH
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      - name: Download MoltenVK / DXVK
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOLTENVK_DXVK_INSTALLATION }}
          path: ${{ env.INSTALLROOT }}

      - name: Unpack MoltenVK / DXVK
        run: |
          set -x
          mkdir -p ${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}
          pushd ${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}
          tar --strip-components=1 -xvf ${{ env.INSTALLROOT }}/${{ env.MOLTENVK_DXVK_INSTALLATION }}.tar.gz
          popd

      - name: Get and Extract Source
        uses: ./.github/actions/get_source
        with:
          crossover-local-file: "${{ env.CROSS_OVER_LOCAL_FILE }}"
          crossover-source-url: "${{ env.CROSS_OVER_SOURCE_URL }}"

      # CrossOver 23+ dropped the old wine32on64 hack. Wine now builds 32- and 64-bit
      # Windows support in a single "WoW64" build, so there is one configure/make/install.
      - name: Configure wine
        uses: ./.github/actions/configure_wine
        with:
          winearch: "wine (WoW64)"
          build-dir: "${{ env.BUILDROOT }}/wine"
          crossflags: "-g -O2"
          cc: "/usr/bin/clang"
          cxx: "/usr/bin/clang++"
          # Load MoltenVK from the Wine's own lib folder, not the build machine's path
          moltenvk-soname: "@loader_path/../../libMoltenVK.dylib"
          configure-params: "--enable-archs=i386,x86_64 --with-vulkan"

      - name: Build wine
        uses: ./.github/actions/make
        with:
          build-dir: "${{ env.BUILDROOT }}/wine"

      - name: Install wine
        uses: ./.github/actions/install
        with:
          build-dir: "${{ env.BUILDROOT }}/wine"
          install-dir: "${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}"

      - name: Add wine64 compatibility symlink
        run: |
          pushd ${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}/usr/local/bin
          ls -la
          # Newer Wine installs a single "wine" loader; keep "wine64" for tools that expect it.
          if [ -e wine ] && [ ! -e wine64 ]; then ln -s wine wine64; fi
          popd

      # The build links against MacPorts libraries in /opt/local/lib (FreeType, GnuTLS, SDL2, …),
      # which other Macs don't have. Copy them, with their own dependencies, into the Wine's lib
      # folder; WineBridge points DYLD_FALLBACK_LIBRARY_PATH there so they're found by name.
      - name: Bundle runtime libraries
        run: |
          set -euo pipefail
          LIB="${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}/usr/local/lib"
          copy_with_deps() {
            local f="$1" base
            [ -e "$f" ] || return 0
            base=$(basename "$f")
            [ -e "$LIB/$base" ] && return 0
            cp -L "$f" "$LIB/$base"
            chmod u+w "$LIB/$base"
            echo "bundled $base"
            for d in $(otool -L "$f" | awk 'NR>1 && /\/opt\/local\/lib\//{print $1}'); do
              copy_with_deps "$d"
            done
          }
          # libraries Wine dlopen()s by name (recorded by configure) …
          for f in $(grep -hoE "ac_cv_lib_soname_[A-Za-z0-9_]+='?/opt/local/lib/[^' ]+" "${{ env.BUILDROOT }}/wine/config.log" \
                     | sed -E "s/^[^=]*='?//" | sort -u); do
            copy_with_deps "$f"
          done
          # … and libraries its Unix side links directly
          for so in "$LIB"/wine/x86_64-unix/*.so; do
            for d in $(otool -L "$so" | awk 'NR>1 && /\/opt\/local\/lib\//{print $1}'); do copy_with_deps "$d"; done
          done

      # DXMT (DirectX 10/11 → Metal, github.com/3Shain/dxmt). WineBridge installs it per bottle.
      - name: Bundle DXMT
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/dxmt" && cd "$RUNNER_TEMP/dxmt"
          gh release download -R 3Shain/dxmt --pattern '*.tar.gz' --pattern '*.zip' --clobber
          for a in *.tar.gz; do [ -f "$a" ] && tar -xzf "$a"; done
          for a in *.zip; do [ -f "$a" ] && unzip -oq "$a"; done
          SO=$(find . -path '*x86_64-unix/winemetal.so' | head -1)
          [ -n "$SO" ]
          SRC=$(dirname "$(dirname "$SO")")
          DEST="${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}/usr/local/lib/dxmt"
          mkdir -p "$DEST"
          cp -R "$SRC"/. "$DEST"/
          find "$DEST" -maxdepth 2 | head -40

      - name: Tar Wine
        run: |
          set -x
          pushd ${{ env.INSTALLROOT }}
          tar -czvf ${{ env.WINE_INSTALLATION }}.tar.gz ${{ env.WINE_INSTALLATION }}
          popd

      - name: Upload Wine
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINE_INSTALLATION }}
          path: ${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}.tar.gz

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="wine-cx${{ env.CROSS_OVER_VERSION }}-build${{ github.run_number }}"
          cat > notes.md <<NOTES
          Wine built from CodeWeavers' open-source CrossOver ${{ env.CROSS_OVER_VERSION }} code
          (source: ${{ env.CROSS_OVER_SOURCE_URL }}), for Intel and Apple Silicon (Rosetta) Macs.

          Includes MoltenVK, DXVK and DXMT (github.com/3Shain/dxmt). Made for WineBridge, which downloads
          the asset below automatically; it can also be used on its own (see usr/local/bin).
          NOTES
          gh release create "$TAG" "${{ env.INSTALLROOT }}/${{ env.WINE_INSTALLATION }}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Wine CrossOver ${{ env.CROSS_OVER_VERSION }} (build ${{ github.run_number }})" \
            --notes-file notes.md --latest
